name: Preview on Cloudflare

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          url=$(npx --yes wrangler@latest preview --name "pr-$PR_NUMBER" --json | jq -er '.preview.urls[0]')

          gh api "repos/$GITHUB_REPOSITORY/statuses/$PR_SHA" \
            -f state=success \
            -f context=preview/cloudflare \
            -f target_url="$url" \
            -f description="Preview ready"
