name: Preview on Cloudflare

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read Node.js version
        id: node-version
        run: echo "version=$(awk -F '\"' '/^node = / { print $2 }' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: withastro/action@v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
      - name: Deploy Cloudflare preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          output="$RUNNER_TEMP/wrangler-preview.ndjson"
          WRANGLER_OUTPUT_FILE_PATH="$output" npx --yes wrangler@latest preview --name "pr-$PR_NUMBER"
          url=$(jq -er 'select(.type == "preview") | .preview_urls[0]' "$output" | tail -n 1)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$PR_SHA" \
            -f state=success \
            -f context=preview/cloudflare \
            -f target_url="$url" \
            -f description="Preview ready"
