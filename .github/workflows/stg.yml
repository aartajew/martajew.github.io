name: Deploy STG to GitHub Pages

on:
  push:
    branches: [stg]

permissions:
  contents: read

concurrency:
  group: stg-pages
  cancel-in-progress: true

jobs:
  stg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Verify STG token
        env:
          STG_REPO_TOKEN: ${{ secrets.STG_REPO_TOKEN }}
        run: |
          if [ -z "$STG_REPO_TOKEN" ]; then
            echo "::error::Add STG_REPO_TOKEN to aartajew/martajew.github.io"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Read Node.js version
        id: node-version
        run: echo "version=$(awk -F '"' '/^node = / { print $2 }' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: withastro/action@v6
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          build-cmd: npm run build -- --site https://stg.acidfairies.com
      - name: Publish static site
        env:
          STG_REPO_TOKEN: ${{ secrets.STG_REPO_TOKEN }}
        run: |
          touch dist/.nojekyll
          echo stg.acidfairies.com > dist/CNAME
          git -C dist init -b gh-pages
          git -C dist config user.name 'github-actions[bot]'
          git -C dist config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C dist add -A
          git -C dist commit -qm "Deploy $GITHUB_SHA"
          git -C dist push --force "https://x-access-token:${STG_REPO_TOKEN}@github.com/aartajew/acid-fairies-stg.git" HEAD:gh-pages
      - name: Test CMS publish dispatch
        if: contains(github.event.head_commit.message, '[poc-publish]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=sveltia-cms-publish
